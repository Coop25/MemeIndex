services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memeindex}
      POSTGRES_USER: ${POSTGRES_USER:-memeindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memeindex}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memeindex} -d ${POSTGRES_DB:-memeindex}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: ${MEMEINDEX_IMAGE:-ghcr.io/Coop25/memeindex:latest}
    pull_policy: always
    restart: unless-stopped
    # The image runs as a non-root user. Match this to the owner of ./data on the
    # host so the bind mount stays writable. Most single-user Linux hosts are
    # 1000:1000; run `id -u` / `id -g` to check, then `sudo chown -R <uid>:<gid> ./data`.
    user: "${MEMEINDEX_UID:-1000}:${MEMEINDEX_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEMEINDEX_ADDR: ${MEMEINDEX_ADDR:-:8080}
      MEMEINDEX_DATA_DIR: ${MEMEINDEX_DATA_DIR:-data}
      MEMEINDEX_DATABASE_URL: postgres://${POSTGRES_USER:-memeindex}:${POSTGRES_PASSWORD:-memeindex}@postgres:5432/${POSTGRES_DB:-memeindex}?sslmode=disable
      MEMEINDEX_MEDIAFETCH_YTDLP_BINARY: ${MEMEINDEX_MEDIAFETCH_YTDLP_BINARY:-yt-dlp}
      # Downloader egress isolation. When MEMEINDEX_MEDIAFETCH_PROXY is set, both
      # yt-dlp (--proxy) and the Go media-fetch HTTP client route through that
      # forward proxy, which should allow ONLY the public media hosts. When it is
      # blank, outbound downloader connections are pinned to public IP addresses
      # only (private/reserved/loopback ranges are refused at connect time).
      # NO_PROXY keeps internal services (Postgres, Ollama) on a direct path.
      # See "Downloader network isolation" in the README.
      MEMEINDEX_MEDIAFETCH_PROXY: ${MEMEINDEX_MEDIAFETCH_PROXY:-}
      HTTP_PROXY: ${MEMEINDEX_MEDIAFETCH_PROXY:-}
      HTTPS_PROXY: ${MEMEINDEX_MEDIAFETCH_PROXY:-}
      NO_PROXY: ${MEMEINDEX_NO_PROXY:-postgres,ollama,localhost,127.0.0.1,::1}
      MEMEINDEX_MEDIAFETCH_RETRY_INTERVAL_SECONDS: ${MEMEINDEX_MEDIAFETCH_RETRY_INTERVAL_SECONDS:-300}
      MEMEINDEX_MEDIAFETCH_RETRY_MAX_ATTEMPTS: ${MEMEINDEX_MEDIAFETCH_RETRY_MAX_ATTEMPTS:-3}
      MEMEINDEX_RATE_LIMIT_ENABLED: ${MEMEINDEX_RATE_LIMIT_ENABLED:-true}
      MEMEINDEX_CLIENT_IP_HEADER: ${MEMEINDEX_CLIENT_IP_HEADER:-}
      MEMEINDEX_TAGSUGGEST_OLLAMA_URL: ${MEMEINDEX_TAGSUGGEST_OLLAMA_URL:-http://ollama:11434}
      MEMEINDEX_TAGSUGGEST_OLLAMA_MODEL: ${MEMEINDEX_TAGSUGGEST_OLLAMA_MODEL:-qwen2.5vl:3b}
      MEMEINDEX_TAGSUGGEST_TIMEOUT_SECONDS: ${MEMEINDEX_TAGSUGGEST_TIMEOUT_SECONDS:-300}
      MEMEINDEX_TAGSUGGEST_MAX_TAGS: ${MEMEINDEX_TAGSUGGEST_MAX_TAGS:-8}
      MEMEINDEX_TAGSUGGEST_KNOWN_TAG_BUDGET: ${MEMEINDEX_TAGSUGGEST_KNOWN_TAG_BUDGET:-60}
      MEMEINDEX_TAGSUGGEST_FAST_MODE: ${MEMEINDEX_TAGSUGGEST_FAST_MODE:-false}
      MEMEINDEX_TAGSUGGEST_GENERATE_ONLY: ${MEMEINDEX_TAGSUGGEST_GENERATE_ONLY:-false}
      MEMEINDEX_TAGSUGGEST_VIDEO_FRAME_COUNT: ${MEMEINDEX_TAGSUGGEST_VIDEO_FRAME_COUNT:-3}
      MEMEINDEX_TAGSUGGEST_VIDEO_FRAME_WIDTH: ${MEMEINDEX_TAGSUGGEST_VIDEO_FRAME_WIDTH:-320}
      MEMEINDEX_TAGSUGGEST_DISABLE_TRANSCRIPTION: ${MEMEINDEX_TAGSUGGEST_DISABLE_TRANSCRIPTION:-true}
      MEMEINDEX_TAGSUGGEST_TRANSCRIBE_BINARY: ${MEMEINDEX_TAGSUGGEST_TRANSCRIBE_BINARY:-}
      MEMEINDEX_TAGSUGGEST_TRANSCRIBE_ARGS: ${MEMEINDEX_TAGSUGGEST_TRANSCRIBE_ARGS:-}
      MEMEINDEX_TAGSUGGEST_TRANSCRIBE_TIMEOUT_SECONDS: ${MEMEINDEX_TAGSUGGEST_TRANSCRIBE_TIMEOUT_SECONDS:-120}
      MEMEINDEX_DISCORD_CLIENT_ID: ${MEMEINDEX_DISCORD_CLIENT_ID:-}
      MEMEINDEX_DISCORD_CLIENT_SECRET: ${MEMEINDEX_DISCORD_CLIENT_SECRET:-}
      MEMEINDEX_DISCORD_REDIRECT_URL: ${MEMEINDEX_DISCORD_REDIRECT_URL:-}
      MEMEINDEX_DISCORD_DYNAMIC_REDIRECT: ${MEMEINDEX_DISCORD_DYNAMIC_REDIRECT:-false}
      MEMEINDEX_SESSION_SECRET: ${MEMEINDEX_SESSION_SECRET:-}
      MEMEINDEX_ALLOW_ANONYMOUS: ${MEMEINDEX_ALLOW_ANONYMOUS:-false}
      MEMEINDEX_MAX_UPLOAD_BYTES: ${MEMEINDEX_MAX_UPLOAD_BYTES:-268435456}
      MEMEINDEX_SHARE_SECRET: ${MEMEINDEX_SHARE_SECRET:-}
      MEMEINDEX_SESSION_DURATION_DAYS: ${MEMEINDEX_SESSION_DURATION_DAYS:-30}
      MEMEINDEX_COOKIE_SECURE: ${MEMEINDEX_COOKIE_SECURE:-false}
      MEMEINDEX_SUPER_ADMIN_USER_IDS: ${MEMEINDEX_SUPER_ADMIN_USER_IDS:-}
      MEMEINDEX_VIEW_USER_IDS: ${MEMEINDEX_VIEW_USER_IDS:-}
      MEMEINDEX_ADD_USER_IDS: ${MEMEINDEX_ADD_USER_IDS:-}
    ports:
      - "${MEMEINDEX_HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_data:/root/.ollama

  ollama-model:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama pull ${MEMEINDEX_TAGSUGGEST_OLLAMA_MODEL:-qwen2.5vl:3b}
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles:
      - tunnel

  # Optional forward proxy for downloader egress isolation. Point it at a config
  # that allows ONLY the public media hosts the downloader needs, for example:
  #   youtube.com, youtu.be, googlevideo.com, ytimg.com,
  #   facebook.com, fbcdn.net, fbsbx.com,
  #   instagram.com, cdninstagram.com,
  #   tiktok.com, tiktokcdn.com, tiktokv.com,
  #   twitter.com, x.com, twimg.com,
  #   reddit.com, redd.it, v.redd.it, redditmedia.com
  # Then set MEMEINDEX_MEDIAFETCH_PROXY=http://egress-proxy:3128 and start this
  # profile. Do NOT let this proxy reach postgres, ollama, the container network
  # gateway, or 169.254.169.254.
  # egress-proxy:
  #   image: ubuntu/squid:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ./deploy/squid-allowlist.conf:/etc/squid/conf.d/allowlist.conf:ro
  #   profiles:
  #     - egress

volumes:
  postgres_data:
  ollama_data:
