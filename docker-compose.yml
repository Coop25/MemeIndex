services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memeindex}
      POSTGRES_USER: ${POSTGRES_USER:-memeindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memeindex}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memeindex} -d ${POSTGRES_DB:-memeindex}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: ${MEMEINDEX_IMAGE:-ghcr.io/Coop25/memeindex:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEMEINDEX_ADDR: ${MEMEINDEX_ADDR:-:8080}
      MEMEINDEX_DATA_DIR: ${MEMEINDEX_DATA_DIR:-data}
      MEMEINDEX_DATABASE_URL: postgres://${POSTGRES_USER:-memeindex}:${POSTGRES_PASSWORD:-memeindex}@postgres:5432/${POSTGRES_DB:-memeindex}?sslmode=disable
      MEMEINDEX_MEDIAFETCH_YTDLP_BINARY: ${MEMEINDEX_MEDIAFETCH_YTDLP_BINARY:-yt-dlp}
      MEMEINDEX_MEDIAFETCH_RETRY_INTERVAL_SECONDS: ${MEMEINDEX_MEDIAFETCH_RETRY_INTERVAL_SECONDS:-300}
      MEMEINDEX_MEDIAFETCH_RETRY_MAX_ATTEMPTS: ${MEMEINDEX_MEDIAFETCH_RETRY_MAX_ATTEMPTS:-3}
      MEMEINDEX_TAGSUGGEST_OLLAMA_URL: ${MEMEINDEX_TAGSUGGEST_OLLAMA_URL:-http://ollama:11434}
      MEMEINDEX_TAGSUGGEST_OLLAMA_MODEL: ${MEMEINDEX_TAGSUGGEST_OLLAMA_MODEL:-qwen2.5vl:3b}
      MEMEINDEX_TAGSUGGEST_TIMEOUT_SECONDS: ${MEMEINDEX_TAGSUGGEST_TIMEOUT_SECONDS:-300}
      MEMEINDEX_TAGSUGGEST_MAX_TAGS: ${MEMEINDEX_TAGSUGGEST_MAX_TAGS:-8}
      MEMEINDEX_TAGSUGGEST_KNOWN_TAG_BUDGET: ${MEMEINDEX_TAGSUGGEST_KNOWN_TAG_BUDGET:-60}
      MEMEINDEX_TAGSUGGEST_FAST_MODE: ${MEMEINDEX_TAGSUGGEST_FAST_MODE:-false}
      MEMEINDEX_TAGSUGGEST_GENERATE_ONLY: ${MEMEINDEX_TAGSUGGEST_GENERATE_ONLY:-false}
      MEMEINDEX_TAGSUGGEST_VIDEO_FRAME_COUNT: ${MEMEINDEX_TAGSUGGEST_VIDEO_FRAME_COUNT:-3}
      MEMEINDEX_TAGSUGGEST_VIDEO_FRAME_WIDTH: ${MEMEINDEX_TAGSUGGEST_VIDEO_FRAME_WIDTH:-320}
      MEMEINDEX_TAGSUGGEST_DISABLE_TRANSCRIPTION: ${MEMEINDEX_TAGSUGGEST_DISABLE_TRANSCRIPTION:-true}
      MEMEINDEX_TAGSUGGEST_TRANSCRIBE_BINARY: ${MEMEINDEX_TAGSUGGEST_TRANSCRIBE_BINARY:-}
      MEMEINDEX_TAGSUGGEST_TRANSCRIBE_ARGS: ${MEMEINDEX_TAGSUGGEST_TRANSCRIBE_ARGS:-}
      MEMEINDEX_TAGSUGGEST_TRANSCRIBE_TIMEOUT_SECONDS: ${MEMEINDEX_TAGSUGGEST_TRANSCRIBE_TIMEOUT_SECONDS:-120}
      MEMEINDEX_DISCORD_CLIENT_ID: ${MEMEINDEX_DISCORD_CLIENT_ID:-}
      MEMEINDEX_DISCORD_CLIENT_SECRET: ${MEMEINDEX_DISCORD_CLIENT_SECRET:-}
      MEMEINDEX_DISCORD_REDIRECT_URL: ${MEMEINDEX_DISCORD_REDIRECT_URL:-}
      MEMEINDEX_DISCORD_DYNAMIC_REDIRECT: ${MEMEINDEX_DISCORD_DYNAMIC_REDIRECT:-false}
      MEMEINDEX_SESSION_SECRET: ${MEMEINDEX_SESSION_SECRET:-replace-with-a-long-random-string}
      MEMEINDEX_SHARE_SECRET: ${MEMEINDEX_SHARE_SECRET:-}
      MEMEINDEX_SESSION_DURATION_DAYS: ${MEMEINDEX_SESSION_DURATION_DAYS:-30}
      MEMEINDEX_COOKIE_SECURE: ${MEMEINDEX_COOKIE_SECURE:-false}
      MEMEINDEX_SUPER_ADMIN_USER_IDS: ${MEMEINDEX_SUPER_ADMIN_USER_IDS:-}
      MEMEINDEX_VIEW_USER_IDS: ${MEMEINDEX_VIEW_USER_IDS:-}
      MEMEINDEX_ADD_USER_IDS: ${MEMEINDEX_ADD_USER_IDS:-}
    ports:
      - "${MEMEINDEX_HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_data:/root/.ollama

  ollama-model:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama pull ${MEMEINDEX_TAGSUGGEST_OLLAMA_MODEL:-qwen2.5vl:3b}
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles:
      - tunnel

volumes:
  postgres_data:
  ollama_data:
