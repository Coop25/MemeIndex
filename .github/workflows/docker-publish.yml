name: Publish Docker Image

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history + tags, not the default shallow/no-tags clone - the
          # "Resolve app version" step below runs `git describe --tags` to
          # find the nearest release on a manual workflow_dispatch run,
          # which needs the tags actually present locally to find anything.
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Only two triggers remain (release, workflow_dispatch), so this is
          # the whole tag set: the release's own version tag (e.g. "v2.9.0"),
          # a short-sha tag, and "latest" - which must key off event_name
          # rather than {{is_default_branch}}, since a release's ref is the
          # tag (refs/tags/vX.Y.Z), not the default branch, so that helper is
          # always false here and would otherwise leave "latest" stuck on
          # whatever a previous manual run last pointed it at.
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}

      - name: Resolve app version
        id: app_version
        shell: bash
        run: |
          # For a manual workflow_dispatch run (not a release), there is no
          # release tag_name to fall back on, and steps.meta.outputs.version
          # would otherwise just be the literal branch name ("master"). Use
          # the nearest reachable release tag instead - just the tag itself
          # (e.g. "v2.7.0"), not git describe's usual "-N-gHASH"
          # commit-distance suffix, since this is meant to read as a plain
          # release number.
          described="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)"

          if [[ "${{ github.event_name }}" == "release" && -n "${{ github.event.release.tag_name }}" ]]; then
            version="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref_type }}" == "tag" && -n "${{ github.ref_name }}" ]]; then
            version="${{ github.ref_name }}"
          elif [[ -n "${described}" ]]; then
            version="${described}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
