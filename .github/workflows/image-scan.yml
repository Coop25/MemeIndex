name: Image Scan

# Scans the runtime image (Debian base, FFmpeg, yt-dlp, the Go binary) for
# known vulnerabilities. govulncheck in ci.yml covers Go dependencies only.
# Findings go to the repository's Security tab; the job fails on fixable
# CRITICAL/HIGH issues so they show up on the PR or commit, but it never
# blocks publishing (docker-publish.yml is separate).

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - go.mod
      - go.sum
      - .github/workflows/image-scan.yml
  schedule:
    # New CVEs land against an unchanged image, so rescan weekly.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Left at its default, the Dockerfile resolves yt-dlp's "latest" release
      # through the GitHub API without a token. Shared runner IPs exhaust that
      # anonymous rate limit, and the build then fails with a 403 before
      # anything is scanned. Resolve the tag here with the job token instead.
      - name: Resolve the latest yt-dlp release
        id: ytdlp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build image (amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: memeindex:scan
          build-args: |
            YTDLP_VERSION=${{ steps.ytdlp.outputs.version }}

      - name: Scan image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: memeindex:scan
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload results to the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Fail on fixable critical or high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: memeindex:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # The report step already installed Trivy; skip installing it again.
          # Its vulnerability database is reused from the action's cache.
          skip-setup-trivy: true
