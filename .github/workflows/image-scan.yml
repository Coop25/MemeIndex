name: Image Scan

# Scans the runtime image (Debian base, FFmpeg, yt-dlp, the Go binary) for
# known vulnerabilities. govulncheck in ci.yml covers Go dependencies only.
# Findings go to the repository's Security tab; the job fails on fixable
# CRITICAL/HIGH issues so they show up on the PR or commit, but it never
# blocks publishing (docker-publish.yml is separate).

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - go.mod
      - go.sum
      - .github/workflows/image-scan.yml
  schedule:
    # New CVEs land against an unchanged image, so rescan weekly.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (amd64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: memeindex:scan

      - name: Scan image (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: memeindex:scan
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload results to the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Fail on fixable critical or high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: memeindex:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # Reuse the database downloaded by the report step.
          skip-setup-trivy: true
