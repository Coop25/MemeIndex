name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    env:
      GOTELEMETRY: "off"
      # Exercises the real SQL query paths in internal/accessor; the test skips
      # itself when this is unset.
      MEMEINDEX_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/memeindex_test?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memeindex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: warn

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      GOTELEMETRY: "off"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # golangci-lint compares against the merge base to gate on regressions
          # only (see issues.new-from-merge-base in .golangci.yml).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    env:
      GOTELEMETRY: "off"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend unit tests
        run: node --test scripts/*.test.cjs
