name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    env:
      GOTELEMETRY: "off"
      # Exercises the real SQL query paths in internal/accessor; the test skips
      # itself when this is unset.
      MEMEINDEX_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/memeindex_test?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memeindex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # -coverpkg counts code exercised from another package's tests (for
        # example internal/audiobooks driven by the client handler tests).
        run: go test -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce coverage floor
        env:
          # Total statement coverage was 53.7% when this floor was set. Raise
          # it as coverage grows; lowering it should be a deliberate choice.
          COVERAGE_MIN: "50"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "Total coverage: ${total}% (floor ${COVERAGE_MIN}%)"
          if ! awk -v t="$total" -v min="$COVERAGE_MIN" 'BEGIN { exit !(t + 0 >= min + 0) }'; then
            echo "::error::Go test coverage ${total}% is below the ${COVERAGE_MIN}% floor"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: warn

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      GOTELEMETRY: "off"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # golangci-lint compares against the merge base to gate on regressions
          # only (see issues.new-from-merge-base in .golangci.yml).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    env:
      GOTELEMETRY: "off"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run frontend unit tests
        run: node --test scripts/*.test.cjs

      - name: Type-check opted-in frontend files
        # Checks every static/ file that starts with "// @ts-check".
        run: npx --yes -p typescript@5.9.3 tsc -p tsconfig.json
